<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV → Excel 変換ツール</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #1a1a2e;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 2rem;
    }

    .drop-zone {
      border: 2px dashed #c0cbe0;
      border-radius: 12px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #4a7aff;
      background: #f0f4ff;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    .drop-text {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.6;
    }

    .drop-text span {
      color: #4a7aff;
      font-weight: 600;
    }

    .file-hint {
      font-size: 0.78rem;
      color: #999;
      margin-top: 0.4rem;
    }

    /* encoding selector */
    .options {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .options label {
      font-size: 0.875rem;
      color: #555;
      white-space: nowrap;
    }

    .options select {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d0d7e3;
      border-radius: 8px;
      font-size: 0.875rem;
      background: #fff;
      color: #333;
      cursor: pointer;
    }

    /* file list */
    .file-list {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f0f4ff;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 0.875rem;
    }

    .file-item .name {
      font-weight: 500;
      color: #1a1a2e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px;
    }

    .file-item .remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      font-size: 1rem;
      padding: 0 0.25rem;
      line-height: 1;
    }
    .file-item .remove:hover { color: #e55; }

    /* convert button */
    .btn {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.85rem;
      background: #4a7aff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn:hover:not(:disabled) { background: #3060e0; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* messages */
    .message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }
    .message.success { background: #e6f9f0; color: #1a7a4a; display: block; }
    .message.error   { background: #fde8e8; color: #b91c1c; display: block; }

    footer {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>CSV → Excel 変換</h1>
  <p class="subtitle">CSVファイルをドラッグ＆ドロップするか、クリックして選択してください。</p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".csv,text/csv" multiple />
    <div class="drop-icon">📄</div>
    <p class="drop-text">
      ここにCSVをドロップ<br />または<span>クリックして選択</span>
    </p>
    <p class="file-hint">複数ファイル対応 · .csv のみ</p>
  </div>

  <div class="options">
    <label for="encoding">文字コード</label>
    <select id="encoding">
      <option value="UTF-8">UTF-8</option>
      <option value="Shift_JIS">Shift_JIS（Windows日本語）</option>
      <option value="EUC-JP">EUC-JP</option>
    </select>
  </div>

  <div class="file-list" id="fileList"></div>

  <button class="btn" id="convertBtn" disabled>Excelに変換してダウンロード</button>

  <div class="message" id="message"></div>
</div>

<footer>処理はすべてブラウザ内で完結します。ファイルはサーバーに送信されません。</footer>

<script>
  const dropZone   = document.getElementById('dropZone');
  const fileInput  = document.getElementById('fileInput');
  const fileList   = document.getElementById('fileList');
  const convertBtn = document.getElementById('convertBtn');
  const message    = document.getElementById('message');
  const encoding   = document.getElementById('encoding');

  let selectedFiles = [];

  // drag & drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    addFiles([...e.dataTransfer.files]);
  });

  fileInput.addEventListener('change', () => {
    addFiles([...fileInput.files]);
    fileInput.value = '';
  });

  function addFiles(files) {
    const csvFiles = files.filter(f => f.name.toLowerCase().endsWith('.csv'));
    if (csvFiles.length !== files.length) showMessage('CSVファイル以外はスキップされました。', 'error');
    csvFiles.forEach(f => {
      if (!selectedFiles.find(s => s.name === f.name && s.size === f.size)) {
        selectedFiles.push(f);
      }
    });
    renderList();
  }

  function renderList() {
    fileList.innerHTML = '';
    selectedFiles.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <span class="name" title="${f.name}">${f.name}</span>
        <button class="remove" data-i="${i}" title="削除">✕</button>
      `;
      fileList.appendChild(item);
    });
    fileList.querySelectorAll('.remove').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedFiles.splice(Number(btn.dataset.i), 1);
        renderList();
      });
    });
    convertBtn.disabled = selectedFiles.length === 0;
    if (selectedFiles.length > 0) clearMessage();
  }

  convertBtn.addEventListener('click', async () => {
    convertBtn.disabled = true;
    convertBtn.textContent = '変換中…';
    clearMessage();

    try {
      for (const file of selectedFiles) {
        await convertFile(file);
      }
      showMessage(`${selectedFiles.length}件のファイルを変換しました。`, 'success');
    } catch (err) {
      showMessage('エラーが発生しました: ' + err.message, 'error');
    } finally {
      convertBtn.disabled = false;
      convertBtn.textContent = 'Excelに変換してダウンロード';
    }
  });

  function convertFile(file) {
    return new Promise((resolve, reject) => {
      const enc = encoding.value;
      const reader = new FileReader();

      reader.onload = e => {
        try {
          const text = e.target.result;
          const wb = XLSX.read(text, { type: 'string' });
          const xlsxName = file.name.replace(/\.csv$/i, '.xlsx');
          XLSX.writeFile(wb, xlsxName);
          resolve();
        } catch (err) {
          reject(err);
        }
      };

      reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました。'));

      if (enc === 'UTF-8') {
        reader.readAsText(file, 'UTF-8');
      } else {
        // read as ArrayBuffer then decode with TextDecoder for Shift_JIS / EUC-JP
        const abReader = new FileReader();
        abReader.onload = ev => {
          try {
            const decoded = new TextDecoder(enc).decode(ev.target.result);
            const wb = XLSX.read(decoded, { type: 'string' });
            const xlsxName = file.name.replace(/\.csv$/i, '.xlsx');
            XLSX.writeFile(wb, xlsxName);
            resolve();
          } catch (err) {
            reject(err);
          }
        };
        abReader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました。'));
        abReader.readAsArrayBuffer(file);
      }
    });
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'message ' + type;
  }
  function clearMessage() {
    message.className = 'message';
    message.textContent = '';
  }
</script>
</body>
</html>
